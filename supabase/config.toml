# Supabase CLI config for local development (`supabase start`). Requires Docker.
project_id = "willwar"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Local mail catcher: sign-in codes land here (http://localhost:54324).
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/app/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# 6-digit codes, not magic links: links open in Safari instead of the installed app.
otp_length = 6
otp_expiry = 600

[auth.rate_limit]
email_sent = 10

# Google sign-in: set the client id/secret in the dashboard (or here via env) before enabling.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.send-reminders]
verify_jwt = true
