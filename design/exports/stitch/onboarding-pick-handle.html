<!-- Interactive Organic Pebble Morphing Micro-Script -->
<script>
    const pebble = document.getElementById('pebble-token');
    const shuffleBtn = document.getElementById('shuffle-btn');

    const organicShapes = [
      '64% 36% 47% 53% / 41% 54% 46% 59%',
      '38% 62% 63% 37% / 70% 33% 67% 30%',
      '50% 50% 30% 70% / 55% 42% 58% 45%',
      '71% 29% 40% 60% / 30% 69% 31% 70%',
      '45% 55% 72% 28% / 60% 40% 60% 40%'
    ];

    const marinePalettes = [
      'linear-gradient(135deg, #066c7d 0%, #00363f 100%)',
      'linear-gradient(145deg, #006878 0%, #06404d 100%)',
      'linear-gradient(130deg, #356178 0%, #004e5b 100%)',
      'linear-gradient(160deg, #0a3f55 0%, #002830 100%)'
    ];

    let shapeIdx = 0;
    let colorIdx = 0;

    function randomizePebble() {
      shapeIdx = (shapeIdx + 1) % organicShapes.length;
      colorIdx = (colorIdx + 1) % marinePalettes.length;

      pebble.style.borderRadius = organicShapes[shapeIdx];
      pebble.style.background = marinePalettes[colorIdx];
      pebble.style.transform = `scale(0.94) rotate(${Math.floor(Math.random() * 20) - 10}deg)`;

      setTimeout(() => {
        pebble.style.transform = 'scale(1) rotate(0deg)';
      }, 250);
    }

    if (shuffleBtn) {
      shuffleBtn.addEventListener('click', randomizePebble);
    }
    if (pebble) {
      pebble.addEventListener('click', randomizePebble);
    }
  </script>
